{% extends "auth_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <div class="text-center">
    <div class="empty-icon mx-auto" style="width:72px;height:72px;font-size:1.7rem;">
      <i class="bi bi-shield-exclamation"></i>
    </div>
    <div class="eyebrow mb-2">Error {{ code }}</div>
    <h2 class="mb-2">{{ title }}</h2>
    <p class="subtitle mb-4">{{ message }}</p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">
        <i class="bi bi-arrow-left me-1"></i>{{ 'Back to dashboard' if current_user.is_authenticated else 'Back to sign in' }}
      </a>
      <a class="btn btn-outline-secondary" href="javascript:history.back()">Go back</a>
    </div>
  </div>
{% endblock %}
